# vhost d'administration — boucle locale uniquement, jamais expose a Internet.
#
# Sert le meme site que le vhost public, mais autorise toutes les methodes sur
# /api/ : curation, rafraichissements, arbitrage des themes.
#
# Acces depuis le poste local :
#   ssh -N -L 8080:127.0.0.1:8080 hemicycle@<IP_DU_VPS>
#   puis http://localhost:8080
#
# Le `listen 127.0.0.1` est la seule barriere : ne jamais le remplacer par une
# adresse publique, ne jamais ouvrir le port 8080 dans le pare-feu.

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /home/hemicycle/www;
    index index.html;

    access_log /var/log/nginx/hemicycle-admin.access.log;
    error_log  /var/log/nginx/hemicycle-admin.error.log;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une extraction ou une proposition de themes appelle un LLM : long.
        proxy_connect_timeout 10s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
