# vhost public
#
# Le domaine n'est pas ecrit ici : le depot est public, l'instance ne l'est pas.
# `__DOMAINE_PUBLIC__` est substitue a l'installation (voir
# todo/SPEC-DEPLOIEMENT.md §4.7) ; nginx ne voit jamais le marqueur.
#
# Ce fichier est livre en HTTP seul. `certbot --nginx -d <domaine> --redirect`
# le reecrit en place pour ajouter le bloc 443, les certificats et la
# redirection 80 -> 443. Ne pas reinstaller ce fichier par-dessus la version
# modifiee par Certbot sans rejouer certbot derriere.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINE_PUBLIC__;

    root /home/hemicycle/www;
    index index.html;

    access_log /var/log/nginx/hemicycle.access.log;
    error_log  /var/log/nginx/hemicycle.error.log;

    # Les reponses de l'API peuvent etre volumineuses (listes de scrutins).
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Challenge ACME (Let's Encrypt), methode webroot. Le `^~` le fait passer
    # avant le `location /`, sinon le fallback SPA renvoie 404 et l'emission du
    # certificat echoue. A conserver : les renouvellements passent par la.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- Ecriture interdite depuis Internet -------------------------------
    # Les routes POST de l'API sont des actions d'administration : ingestion
    # Assemblee nationale, curation, thematisation LLM. Aucune n'est utilisee
    # par un parcours de consultation. Sans ce filtre, n'importe qui declenche
    # les ingestions et consomme la cle Anthropic.
    # L'administration passe par le vhost local et un tunnel SSH :
    #   ssh -N -L 8080:127.0.0.1:8080 hemicycle@<IP_DU_VPS>
    location /api/ {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le rafraichissement d'un dossier interroge des sources externes.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Actifs Vite : nom de fichier porteur d'un hash, donc immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue rend index.html, jamais un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais etre mis en cache, sinon le navigateur reclame
    # des actifs supprimes par le deploiement suivant.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
