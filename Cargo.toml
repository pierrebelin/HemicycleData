[package]
name = "hemicycle-data"
version = "0.1.0"
edition = "2021"
# Les binaires de `src/bin/` sont des outils de mesure jetables. `cargo run`
# lance le serveur.
default-run = "hemicycle-data"

# Outil d'exploitation, pas un binaire jetable : le CRON et l'operateur en
# dependent pour deriver le jeton du jour.
[[bin]]
name = "admin-token"
path = "src/bin/admin_token.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
# `default-features = false` coupe `default-tls`, qui tirait native-tls puis
# openssl-sys : compiler exigeait alors pkg-config et libssl-dev sur la machine
# de build. Tout le projet est deja sur rustls (voir sqlx ci-dessus).
# `charset` et `http2` sont des defauts de reqwest, remis a la main.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
    "http2",
] }
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
# Derivation du jeton d'administration du jour (voir
# src/infrastructure/security.rs). Implementations Rust pures : ni openssl-sys
# ni pkg-config a l'installation, comme le reste du projet.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# `oneshot` sur le routeur : les tests d'integration de l'API appellent les
# routes sans ouvrir de socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
