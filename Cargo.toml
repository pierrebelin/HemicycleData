[package]
name = "hemicycle-data"
version = "0.1.0"
edition = "2021"
# Les binaires de `src/bin/` sont des outils de mesure jetables. `cargo run`
# lance le serveur.
default-run = "hemicycle-data"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
